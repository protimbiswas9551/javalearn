spring.application.name=JavaLearn
server.port=${PORT:8080}

# ---- GitHub repository that is the source of truth for the Projects section ----
github.owner=protimbiswas9551
github.repo=Java-Projects-Collections
# HEAD means "the default branch of the repository"
github.branch=HEAD
# Folder inside the repository that contains the project folders.
# Leave it empty if the project folders are directly in the repository root.
github.projects-path=Projects

# Optional GitHub token (read-only, no scopes needed). Raises the API limit from 60 to 5000 requests per hour
# and enables the "Recently updated" sort. Best set as an environment variable: GITHUB_TOKEN=...
github.token=${GITHUB_TOKEN:}

# ---- Java playground: code is run by an EXTERNAL service, never on this server ----
# Default: the public Judge0 CE service (free, shared, rate limited, no key needed).
sandbox.enabled=true
sandbox.url=https://ce.judge0.com
# Only if your service needs a token. Keep it in an environment variable, never in the browser code.
sandbox.api-key=${SANDBOX_API_KEY:}
sandbox.api-key-header=X-Auth-Token
# 0 = automatically use the newest "Java (...)" language the service offers
sandbox.language-id=0
sandbox.timeout-seconds=25

# ---- Java X-Ray execution visualizer ----
# X-Ray compiles and traces user code on THIS server using JDI (Java Debug Interface).
# The user code runs in a SEPARATE, isolated JVM process (not inside the Spring Boot JVM).
# Requires a JDK (not just a JRE). Set to false to disable the feature.
xray.enabled=${XRAY_ENABLED:false}

# ---- AI Java Assistant ----
# Provider options: "gemini" (default, free tier), "openai", "groq"
ai.assistant.enabled=${AI_ASSISTANT_ENABLED:true}
ai.assistant.provider=gemini
# Gemini API Key (or set GEMINI_API_KEY environment variable)
ai.assistant.gemini.api-key=${GEMINI_API_KEY:}
ai.assistant.gemini.model=gemini-flash-lite-latest
# Alternativ
OpenAI / Groq / custom compatible endpoint
ai.assistant.openai.api-key=${OPENAI_API_KEY:}
ai.assistant.openai.model=gpt-4o-mini
ai.assistant.openai.base-url=https://api.openai.com/v1
# Groq
ai.assistant.groq.api-key=${GROQ_API_KEY:}
ai.assistant.groq.model=llama-3.3-70b-versatile
ai.assistant.timeout-seconds=60
